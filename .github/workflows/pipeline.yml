name: Daily pipeline

on:
  schedule:
    - cron: "*/15 * * * *"   # har 15 minute
  workflow_dispatch:
    inputs:
      days:
        description: "Number of days to fetch data for"
        default: "1"

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      GITHUB_API: ${{ secrets.GH_API }}
      GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch and load data (ETL)
        run: python -m pipeline.run_pipeline ${{ inputs.days || '1' }}

      - name: Build dashboard stats
        run: python -m pipeline.aggregate.build_stats